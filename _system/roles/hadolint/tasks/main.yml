---
- name: Install hadolint on macOS
  community.general.homebrew:
    name: hadolint
    state: present
  when: ansible_os_family == "Darwin"

- name: Download hadolint binary (Ubuntu)
  ansible.builtin.get_url:
    url: "https://github.com/hadolint/hadolint/releases/download/v{{ hadolint_version }}/hadolint-linux-x86_64"
    dest: "{{ ansible_env.HOME }}/.local/share/hadolint-{{ hadolint_version }}"
    mode: "0755"
    checksum: "sha256:{{ hadolint_linux_sha256 }}"
  when: ansible_os_family == "Debian"

- name: Symlink hadolint into PATH (Ubuntu)
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.local/share/hadolint-{{ hadolint_version }}"
    dest: "{{ ansible_env.HOME }}/.local/bin/hadolint"
    state: link
  when: ansible_os_family == "Debian"
