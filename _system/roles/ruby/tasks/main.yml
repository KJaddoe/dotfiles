---
- name: Install Ruby build dependencies (Ubuntu)
  ansible.builtin.apt:
    name:
      - git
      - curl
      - build-essential
      - libssl-dev
      - libreadline-dev
      - zlib1g-dev
      - libyaml-dev
      - libgdbm-dev
      - libncurses5-dev
      - libffi-dev
      - libdb-dev
    state: present
    update_cache: yes
  become: true
  when: ansible_facts.os_family == "Debian"

- name: Install Ruby build dependencies (macOS)
  community.general.homebrew:
    name:
      - openssl@3
      - readline
      - libyaml
    state: present
  when: ansible_facts.os_family == "Darwin"

- name: Get current global Ruby from mise
  ansible.builtin.command: mise current ruby
  register: mise_ruby_current
  changed_when: false
  failed_when: false

- name: Install and pin Ruby {{ ruby_version }} via mise
  ansible.builtin.command: mise use -g ruby@{{ ruby_version }}
  when: mise_ruby_current.stdout | trim != ruby_version

- name: Get installed Ruby gems
  ansible.builtin.command: mise exec -- gem list
  register: ruby_gems_installed
  changed_when: false

# gem install has no "already present" skip of its own - unlike mise/uv, it
# reinstalls (and bumps) every listed gem on every run, so missing gems are
# filtered here instead of relying on changed_when to notice after the fact.
- name: Install missing global Ruby gems
  ansible.builtin.command: mise exec -- gem install {{ item }}
  loop: "{{ ruby_global_gems }}"
  when: item not in ruby_gems_installed.stdout
  register: gem_install
  changed_when: "'Successfully installed' in gem_install.stdout"

- name: Verify Ruby installation
  ansible.builtin.command: mise exec -- ruby -v
  register: ruby_version_output
  changed_when: false

- name: Show Ruby version
  ansible.builtin.debug:
    msg: "{{ ruby_version_output.stdout }}"
