---
- name: Install prerequisites (Ubuntu)
  ansible.builtin.apt:
    name:
      - curl
      - gnupg
      - ca-certificates
      - apt-transport-https
      - python3-debian
      - bzip2
    state: present
    update_cache: yes
  become: true
  when: ansible_facts.os_family == "Debian"

- name: Create keyrings directory (Ubuntu)
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  when: ansible_facts.os_family == "Debian"

- name: Add Microsoft signing key (Ubuntu)
  become: true
  ansible.builtin.get_url:
    url: https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/apt/keyrings/microsoft.asc
    mode: "0644"
  when: ansible_facts.os_family == "Debian"

- name: Add Microsoft SQL Server repository (Ubuntu)
  become: true
  ansible.builtin.deb822_repository:
    name: microsoft-prod
    types: deb
    uris: https://packages.microsoft.com/ubuntu/{{ ansible_facts.distribution_version }}/prod
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    architectures: amd64
    signed_by: /etc/apt/keyrings/microsoft.asc
    state: present
  when: ansible_facts.os_family == "Debian"

- name: Install sqlcmd tools (Ubuntu)
  become: true
  environment:
    ACCEPT_EULA: 'Y'
  ansible.builtin.apt:
    name:
      - mssql-tools18
      - unixodbc-dev
    state: present
    update_cache: yes
  when: ansible_facts.os_family == "Debian"

- name: Download go-sqlcmd archive (Ubuntu)
  ansible.builtin.get_url:
    url: "https://github.com/microsoft/go-sqlcmd/releases/download/v{{ sqlcmd_go_version }}/sqlcmd-linux-amd64.tar.bz2"
    dest: "{{ ansible_env.HOME }}/.local/share/sqlcmd-{{ sqlcmd_go_version }}.tar.bz2"
    mode: "0644"
    checksum: "sha256:{{ sqlcmd_go_linux_sha256 }}"
  when: ansible_facts.os_family == "Debian"

- name: Create go-sqlcmd versioned install directory (Ubuntu)
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/share/sqlcmd-{{ sqlcmd_go_version }}"
    state: directory
    mode: "0755"
  when: ansible_facts.os_family == "Debian"

- name: Extract go-sqlcmd archive (Ubuntu)
  ansible.builtin.unarchive:
    src: "{{ ansible_env.HOME }}/.local/share/sqlcmd-{{ sqlcmd_go_version }}.tar.bz2"
    dest: "{{ ansible_env.HOME }}/.local/share/sqlcmd-{{ sqlcmd_go_version }}"
    include:
      - sqlcmd
    mode: "0755"
    remote_src: true
    creates: "{{ ansible_env.HOME }}/.local/share/sqlcmd-{{ sqlcmd_go_version }}/sqlcmd"
  when: ansible_facts.os_family == "Debian"

- name: Symlink go-sqlcmd into PATH (Ubuntu)
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.local/share/sqlcmd-{{ sqlcmd_go_version }}/sqlcmd"
    dest: "{{ ansible_env.HOME }}/.local/bin/sqlcmd"
    state: link
    force: true
  when: ansible_facts.os_family == "Debian"

- name: Install sqlcmd (macOS)
  community.general.homebrew:
    name: sqlcmd
    state: present
  when: ansible_facts.os_family == "Darwin"
