---
- name: Install Ollama on macOS
  homebrew:
    name: ollama
    state: present
  when: ansible_facts.os_family == "Darwin"

- name: Install Ollama on Ubuntu using official script
  shell: |
    /bin/bash -c "$(curl -fsSL {{ ollama_ubuntu_install_script }})"
  args:
    creates: /usr/local/bin/ollama
  become: true
  when: ansible_facts.os_family == "Debian"

- name: Start Ollama service (macOS)
  command: brew services start ollama
  register: ollama_brew_service
  changed_when: "'Successfully started' in ollama_brew_service.stdout"
  when: ansible_facts.os_family == "Darwin"

- name: Start and enable Ollama service (Ubuntu)
  become: true
  service:
    name: ollama
    state: started
    enabled: true
  when: ansible_facts.os_family == "Debian"

- name: Wait for Ollama API to be reachable
  wait_for:
    host: 127.0.0.1
    port: 11434
    timeout: 60

- name: List already-pulled Ollama models
  command: ollama list
  register: ollama_list
  changed_when: false

- name: Pull local Ollama models
  command: "ollama pull {{ item }}"
  loop:
    - "{{ ollama_model }}"
    - "{{ ollama_small_model }}"
  when: item not in ollama_list.stdout

- name: Verify Ollama installation
  command: ollama --version
  register: ollama_version
  changed_when: false

- name: Show Ollama version
  debug:
    msg: "Ollama installed: {{ ollama_version.stdout }}"
