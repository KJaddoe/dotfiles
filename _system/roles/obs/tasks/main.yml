---
- name: Install OBS (macOS)
  community.general.homebrew_cask:
    name: obs
    state: present
  when: ansible_facts.os_family == "Darwin"

- name: Check installed BlackHole version (macOS)
  ansible.builtin.command: pkgutil --pkg-info {{ obs_blackhole_pkg_id }}
  register: obs_blackhole_receipt
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == "Darwin"

# Not the blackhole-2ch cask: its pkg runs sudo itself, which never receives the -K password.
- name: Install BlackHole (macOS)
  when:
    - ansible_facts.os_family == "Darwin"
    - "('version: ' ~ obs_blackhole_version) not in obs_blackhole_receipt.stdout"
  block:
    - name: Create root-only BlackHole download directory (macOS)
      become: true
      ansible.builtin.file:
        path: "{{ obs_blackhole_pkg | dirname }}"
        state: directory
        owner: root
        group: wheel
        mode: "0700"

    # Root downloads it into a root-only directory, so the checksummed file is the one installed.
    - name: Download BlackHole package (macOS)
      become: true
      ansible.builtin.get_url:
        url: "https://existential.audio/downloads/BlackHole2ch-{{ obs_blackhole_version }}.pkg"
        dest: "{{ obs_blackhole_pkg }}"
        mode: "0644"
        checksum: "sha256:{{ obs_blackhole_sha256 }}"

    - name: Install BlackHole package (macOS)
      become: true
      ansible.builtin.command: installer -pkg {{ obs_blackhole_pkg }} -target /
      changed_when: true

- name: Check installed background removal plugin version (macOS)
  ansible.builtin.command: >-
    pkgutil --volume {{ ansible_facts.env.HOME }} --pkg-info {{ obs_backgroundremoval_pkg_id }}
  register: obs_backgroundremoval_receipt
  changed_when: false
  failed_when: false
  when: ansible_facts.os_family == "Darwin"

- name: Install background removal plugin (macOS)
  when:
    - ansible_facts.os_family == "Darwin"
    - "('version: ' ~ obs_backgroundremoval_version) not in obs_backgroundremoval_receipt.stdout"
  block:
    - name: Download background removal plugin package (macOS)
      ansible.builtin.get_url:
        url: "https://github.com/royshil/obs-backgroundremoval/releases/download/{{ obs_backgroundremoval_version }}/obs-backgroundremoval-{{ obs_backgroundremoval_version }}-macos-universal.pkg"
        dest: "{{ obs_backgroundremoval_pkg }}"
        mode: "0644"
        checksum: "sha256:{{ obs_backgroundremoval_macos_sha256 }}"

    # The package only offers the current-user domain, so it needs no root.
    - name: Install background removal plugin package (macOS)
      ansible.builtin.command: >-
        installer -pkg {{ obs_backgroundremoval_pkg }} -target CurrentUserHomeDirectory
      changed_when: true

- name: Install OBS PPA prerequisites (Ubuntu)
  become: true
  ansible.builtin.apt:
    name:
      - software-properties-common
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Add OBS Studio PPA (Ubuntu)
  become: true
  ansible.builtin.command: add-apt-repository -y ppa:obsproject/obs-studio
  register: obs_ppa
  changed_when: "'already exists' not in obs_ppa.stdout"
  when: ansible_facts.os_family == "Debian"

- name: Install OBS and the virtual camera module (Ubuntu)
  become: true
  ansible.builtin.apt:
    name:
      - obs-studio
      - v4l2loopback-dkms
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"
