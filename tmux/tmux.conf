# Automatically set window title and don't let it change
set-option -g set-titles on
set-option -g allow-rename off

# Renumber windows
set-option -g renumber-windows on

#Use 256 color
set -g default-terminal "tmux-256color"
#Use RGB color
set -as terminal-features ",*:RGB"

# Extended keys + passthrough (modified keys, fullscreen TUI apps)
set -s extended-keys on
set -as terminal-features ",*:extkeys"
set -g allow-passthrough on

# Mouse support
set -g mouse on

# ----------------------- Plugins -----------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'christoomey/vim-tmux-navigator'

# Fuzzy session/window/pane switcher (prefix + F)
set -g @plugin 'sainnhe/tmux-fzf'

# Persist and auto-restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'


run '~/.tmux/plugins/tpm/tpm'

# ----------------------- Status line -----------------------
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100
set -g status-style "fg=#dcd7ba,bg=#16161d"

set -g status-left "#{?client_prefix,#[fg=#16161d]#[bg=#ffa066]#[bold] #S:#I.#P #[fg=#ffa066]#[bg=#2a2a37]#[nobold],#{?pane_in_mode,#[fg=#16161d]#[bg=#957fb8]#[bold] #S:#I.#P #[fg=#957fb8]#[bg=#2a2a37]#[nobold],#[fg=#16161d]#[bg=#7e9cd8]#[bold] #S:#I.#P #[fg=#7e9cd8]#[bg=#2a2a37]#[nobold]}}"
set -g status-right "#[fg=#2a2a37]#[bg=#16161d]#[fg=#98bb6c]#[bg=#2a2a37] #(tmux-git-branch '#{pane_current_path}')  #[fg=#7fb4ca]#{b:pane_current_path}  #[fg=#e6c384]#(tmux-battery) #[fg=#7e9cd8]#[bg=#2a2a37]#[fg=#16161d]#[bg=#7e9cd8]#[bold] %H:%M "

setw -g window-status-separator ""
setw -g window-status-style "fg=#727169,bg=#2a2a37"
setw -g window-status-format "#[fg=#727169]#[bg=#2a2a37]#[nobold] #I #W #{?window_end_flag,#[fg=#2a2a37]#[bg=#16161d],}"
setw -g window-status-current-style "fg=#7e9cd8,bg=#2a2a37"
setw -g window-status-current-format "#[fg=#7e9cd8]#[bg=#2a2a37]#[bold] #I #W#{?window_zoomed_flag, Z,} #[nobold]#{?window_end_flag,#[fg=#2a2a37]#[bg=#16161d],}"

# ----------------------- Theme -----------------------
set -g mode-style "fg=#7e9cd8,bg=#223249"
set -g message-style "fg=#7e9cd8,bg=#223249"
set -g message-command-style "fg=#7e9cd8,bg=#223249"
set -g pane-border-style "fg=#363646"
set -g pane-active-border-style "fg=#7e9cd8"
set -g copy-mode-match-style "fg=#16161d,bg=#e6c384"
set -g copy-mode-current-match-style "fg=#16161d,bg=#ffa066"
