# Automatically set window title and don't let it change
set-option -g set-titles on
set-option -g allow-rename off

# Renumber windows
set-option -g renumber-windows on

#Use 256 color
set -g default-terminal "tmux-256color"
#Use RGB color
set -as terminal-features ",*:RGB"

# Extended keys + passthrough (modified keys, fullscreen TUI apps)
set -s extended-keys on
set -as terminal-features ",*:extkeys"
set -g allow-passthrough on

# Mouse support
set -g mouse on

# ----------------------- Plugins -----------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'christoomey/vim-tmux-navigator'

# Fuzzy session/window/pane switcher (prefix + F)
set -g @plugin 'sainnhe/tmux-fzf'

# Persist and auto-restore sessions across restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'


run '~/.tmux/plugins/tpm/tpm'

# ----------------------- Status line -----------------------
set -g status on
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100
set -g status-style "fg=#a9b1d6,bg=#16161e"

set -g status-left "#{?client_prefix,#[fg=#16161e]#[bg=#ff9e64]#[bold] #S:#I.#P #[fg=#ff9e64]#[bg=#292e42]#[nobold],#{?pane_in_mode,#[fg=#16161e]#[bg=#bb9af7]#[bold] #S:#I.#P #[fg=#bb9af7]#[bg=#292e42]#[nobold],#[fg=#16161e]#[bg=#7aa2f7]#[bold] #S:#I.#P #[fg=#7aa2f7]#[bg=#292e42]#[nobold]}}"
set -g status-right "#[fg=#292e42]#[bg=#16161e]#[fg=#9ece6a]#[bg=#292e42] #(tmux-git-branch '#{pane_current_path}')  #[fg=#7dcfff]#{b:pane_current_path}  #[fg=#e0af68]#(tmux-battery) #[fg=#7aa2f7]#[bg=#292e42]#[fg=#16161e]#[bg=#7aa2f7]#[bold] %H:%M "

setw -g window-status-separator ""
setw -g window-status-style "fg=#737aa2,bg=#292e42"
setw -g window-status-format "#[fg=#737aa2]#[bg=#292e42]#[nobold] #I #W #{?window_end_flag,#[fg=#292e42]#[bg=#16161e],}"
setw -g window-status-current-style "fg=#7aa2f7,bg=#292e42"
setw -g window-status-current-format "#[fg=#7aa2f7]#[bg=#292e42]#[bold] #I #W#{?window_zoomed_flag, Z,} #[nobold]#{?window_end_flag,#[fg=#292e42]#[bg=#16161e],}"

# ----------------------- Theme -----------------------
set -g mode-style "fg=#7aa2f7,bg=#3b4261"
set -g message-style "fg=#7aa2f7,bg=#3b4261"
set -g message-command-style "fg=#7aa2f7,bg=#3b4261"
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
set -g copy-mode-match-style "fg=#16161e,bg=#e0af68"
set -g copy-mode-current-match-style "fg=#16161e,bg=#ff9e64"
